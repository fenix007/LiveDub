# Тесты и архив расширения. Архив каждого запуска лежит в Artifacts;
# тег vX.Y.Z дополнительно публикует его в GitHub Release с версией X.Y.Z в manifest.json.
name: extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Браузеры Playwright нужны только локальному стенду (make bench), не тестам.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Syntax
        run: for file in server.js yandex-stt.js extension/*.js extension/lib/*.js extension/content/*.js bench/*.mjs bench/*.js; do node --check "$file"; done

      - name: Tests
        run: node --test tests/*.test.mjs

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "Тег должен быть вида v1.2.3, получено: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          jq --arg version "$version" '.version = $version' extension/manifest.json > manifest.tmp
          mv manifest.tmp extension/manifest.json

      - name: Build
        run: |
          make extension-zip
          echo "VERSION=$(jq -r .version extension/manifest.json)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: livedub-extension-${{ env.VERSION }}-${{ github.sha }}
          path: dist/livedub-extension.zip
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: livedub-extension-*
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv livedub-extension.zip "livedub-extension-${GITHUB_REF_NAME}.zip"
          gh release create "$GITHUB_REF_NAME" "livedub-extension-${GITHUB_REF_NAME}.zip" \
            --repo "$GITHUB_REPOSITORY" --title "LiveDub ${GITHUB_REF_NAME}" --generate-notes
